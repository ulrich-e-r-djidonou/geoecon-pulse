name: Déploiement GitHub Pages

on:
  push:
    branches: ["master"]
  # GitHub n'enchaine pas un workflow sur un push effectue avec le
  # GITHUB_TOKEN par defaut (regle anti-boucle), donc le push automatique de
  # "Mise a jour des donnees GeoEcon Pulse" ne declenchait jamais ce
  # deploiement : le site servait des donnees perimees malgre un depot a
  # jour. Ce second declencheur republie des que ce workflow-la se termine.
  workflow_run:
    workflows: ["Mise à jour des données GeoEcon Pulse"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Ne pas republier si la mise a jour des donnees a echoue : mieux vaut
    # servir les dernieres donnees valides que republier un echec.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url
        || steps.deployment_reprise.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Upload des fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # actions/deploy-pages interroge l'API des artefacts juste apres avoir
      # televerse l'archive. Cet appel a deja renvoye un 403 « Error from
      # intermediary » alors que l'upload venait de reussir : une defaillance
      # passagere du cote de GitHub, sans rapport avec le depot, que l'action
      # elle-meme invite a rejouer plus tard. Le workflow de donnees passant
      # trois fois par jour, l'echec se resorbait seul, mais laissait entre
      # temps une croix rouge dans l'onglet Actions d'un depot public servant
      # de piece de portfolio, pour un site qui n'avait rien de casse.
      #
      # Une premiere tentative toleree puis une seconde apres une pause
      # absorbent le blip sans ajouter d'action tierce a la chaine
      # d'approvisionnement. Un 403 qui persiste sur les deux tentatives reste
      # un echec : la croix rouge signale alors un vrai probleme.
      - name: Déploiement sur GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Pause avant la seconde tentative
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Déploiement sur GitHub Pages (seconde tentative)
        id: deployment_reprise
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
