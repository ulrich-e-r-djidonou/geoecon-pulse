name: Déploiement GitHub Pages

on:
  push:
    branches: ["master"]
  # GitHub n'enchaine pas un workflow sur un push effectue avec le
  # GITHUB_TOKEN par defaut (regle anti-boucle), donc le push automatique de
  # "Mise a jour des donnees GeoEcon Pulse" ne declenchait jamais ce
  # deploiement : le site servait des donnees perimees malgre un depot a
  # jour. Ce second declencheur republie des que ce workflow-la se termine.
  workflow_run:
    workflows: ["Mise à jour des données GeoEcon Pulse"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Ne pas republier si la mise a jour des donnees a echoue : mieux vaut
    # servir les dernieres donnees valides que republier un echec.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Upload des fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
