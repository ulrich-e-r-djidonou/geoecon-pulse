name: Mise à jour des données GeoEcon Pulse

# La cadence suit le calendrier des diffuseurs, pas une heure arbitraire.
#
# Statistique Canada et le Bureau of Labor Statistics publient à 8 h 30, heure
# de l'Est : 12 h 30 UTC l'été, 13 h 30 UTC l'hiver. Un seul passage quotidien
# à 12 h 07 UTC tombait systématiquement avant la diffusion, ce qui ajoutait
# près de 24 heures de retard à chaque publication mensuelle.
#
# Trois passages couvrent les deux régimes horaires et la clôture des marchés
# nord-américains.
on:
  schedule:
    - cron: '50 12 * * *'   # 8 h 50 HAE — après les diffusions d'été
    - cron: '50 13 * * *'   # 8 h 50 HNE — après les diffusions d'hiver
    - cron: '30 21 * * *'   # après la clôture de New York et de Toronto
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      # Barrière de non-régression : le filtre rejoue les titres hors sujet
      # réellement parus sur le site. S'il laisse repasser du sport ou un fait
      # divers, la mise à jour ne part pas.
      - name: Test du filtre d'actualités
        run: python scripts/test_news_filter.py

      # Le script sort en 2 quand un indicateur saisi à la main a dépassé son
      # seuil de fraîcheur. Ce n'est pas une raison de jeter des données
      # fraîches : on note le code et on publie quand même.
      - name: Exécution du script de mise à jour
        id: maj
        run: |
          set +e
          python scripts/update_data.py
          echo "code=$?" >> $GITHUB_OUTPUT
          exit 0

      # data/rejets.json, data/coherence.json et data/sante_flux.json sont
      # versionnes au meme titre que les donnees : le rapport hebdomadaire et
      # l'issue de maintenance reconstituent leur historique depuis Git
      # plutot que depuis un journal cumulatif qui grossirait sans fin.
      - name: Vérification des changements
        id: check
        run: |
          git diff --quiet data/indicators.json data/rejets.json \
            data/coherence.json data/sante_flux.json \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit et push si les données ont changé
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/indicators.json data/rejets.json data/coherence.json data/sante_flux.json
          git commit -m "Mise à jour des données — $(date +%Y-%m-%d)"
          git push

      # Trois familles de problemes passent par la meme issue plutot que par
      # un echec du job : indicateur manuel perime, ecart suspect entre deux
      # sources, flux qui ne repond plus. Faire echouer la course afficherait
      # une croix rouge permanente dans l'onglet Actions d'un depot public
      # servant de piece de portfolio, alors que rien n'est casse.
      - name: Signaler les anomalies
        if: steps.maj.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITRE="Anomalies à vérifier"
          python scripts/corps_issue.py > /tmp/corps_issue.md
          CORPS=$(cat /tmp/corps_issue.md)
          EXISTANTE=$(gh issue list --state open --search "$TITRE in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTANTE" ]; then
            gh issue edit "$EXISTANTE" --body "$CORPS"
            echo "Issue #$EXISTANTE mise à jour."
          else
            gh issue create --title "$TITRE" --body "$CORPS"
          fi
          echo "::warning::Le pipeline a détecté une anomalie à vérifier."

      # Le pendant du signalement : une fois les trois familles de problemes
      # revenues a zero, l'issue se referme d'elle-meme plutot que d'attendre
      # qu'quelqu'un y pense.
      - name: Refermer l'issue si tout est réglé
        if: steps.maj.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITRE="Anomalies à vérifier"
          EXISTANTE=$(gh issue list --state open --search "$TITRE in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTANTE" ]; then
            gh issue close "$EXISTANTE" \
              --comment "Plus aucune anomalie au passage du $(date +%Y-%m-%d) : indicateurs à jour, écarts sous le seuil, flux tous en ligne."
            echo "Issue #$EXISTANTE refermée."
          fi

      # Un échec réel du script (code autre que 0 ou 2) doit aussi remonter.
      - name: Échec du script de mise à jour
        if: steps.maj.outputs.code != '0' && steps.maj.outputs.code != '2'
        run: |
          echo "Le script s'est terminé avec le code ${{ steps.maj.outputs.code }}."
          exit 1
